[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diary-cli"
version = "1.0.0"
description = "Консольный дневник на Click, SQLAlchemy и SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
diary = "diary.cli:cli"

[tool.setuptools]
packages = ["diary"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".venv",
    ".env",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "RUF001",  # в строках намеренно используется русский текст
    "RUF002",  # в docstring намеренно используется русский текст
    "RUF003",  # в комментариях намеренно используется русский текст
]

[tool.ruff.lint.isort]
known-first-party = ["diary"]

[tool.ruff.format]
quote-style = "single"
